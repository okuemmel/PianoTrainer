[platformio]
default_envs = s3_n16r8

[env:s3_n16r8]
extends = env:c3_supermini
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_s3_n16r8.csv
build_flags = ${env:c3_supermini.build_flags} -D BOARD_HAS_PSRAM -D TRAINER_BOARD_S3_N16R8

[env:c3_supermini]
extra_scripts =
  pre:tools/platformio_assets.py
  post:tools/platformio_update.py
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel@1.12.5
  bblanchon/ArduinoJson@6.21.5

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++17
test_build_src = no

[env:native_s3]
extends = env:native
build_flags = ${env:native.build_flags} -D TRAINER_BOARD_S3_N16R8
